name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage=manual

  tests-unix:
    name: tests / ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest

    needs: [pre-commit]

    strategy:
      fail-fast: true
      matrix:
        os: [Ubuntu]
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup
        run: python -m pip install --no-cache-dir --quiet .["dev"]

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: us-east-1
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TEST_TABLE_PREFIX: test_${{ github.run_id }}_${{ strategy.job-index }}_
        run: pytest --verbose --durations=5

      # Runs on failure and cancellation too, so killed jobs don't leak tables
      - name: Delete leftover test tables
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: us-east-1
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TEST_TABLE_PREFIX: test_${{ github.run_id }}_${{ strategy.job-index }}_
        run: |
          python - <<'PY'
          import os
          import boto3

          client = boto3.client("dynamodb", region_name="us-east-1")
          prefix = os.environ["TEST_TABLE_PREFIX"]
          for page in client.get_paginator("list_tables").paginate():
              for name in page["TableNames"]:
                  if name.startswith(prefix):
                      # tables the tests already deleted can linger in the listing as DELETING
                      try:
                          client.delete_table(TableName=name)
                          print("deleted leaked table", name)
                      except (client.exceptions.ResourceNotFoundException, client.exceptions.ResourceInUseException):
                          print("table already being deleted", name)
          PY

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest

    needs: [tests-unix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC), no API token needed

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check whether this version is already published
        id: check
        run: |
          python -m pip install --quiet setuptools
          version=$(python setup.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/dynamodictionary/$version/json")
          if [ "$status" = "200" ]; then
            echo "dynamodictionary $version already on PyPI, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: |
          python -m pip install --quiet build twine
          python -m build
          twine check dist/*

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
